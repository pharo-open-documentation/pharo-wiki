<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860" width="1260" height="860" font-family="Helvetica, Arial, sans-serif">
  <title>Pharo graphical stack: what builds on what</title>
  <rect x="0" y="0" width="1260" height="860" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <text x="630" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Pharo graphical stack: what builds on what</text>
  <text x="360" y="40" text-anchor="middle" font-size="12" font-style="italic" fill="#2d6cb5">Morphic side</text>
  <text x="910" y="40" text-anchor="middle" font-size="12" font-style="italic" fill="#2e8b57">Bloc side</text>
  <g font-size="13" fill="#333333">
    <text x="12" y="86">Top layer</text>
    <text x="12" y="196">Widgets</text>
    <text x="12" y="306">Widgets</text>
    <text x="12" y="416">Core UI</text>
    <text x="12" y="526">Drawing</text>
    <text x="12" y="636">Bindings</text>
    <text x="12" y="746">Native libraries</text>
  </g>
  <g stroke="#555555" stroke-width="1.5" fill="none">
    <line x1="350" y1="82" x2="370" y2="82" marker-end="url(#arrow)"/>
    <line x1="350" y1="114" x2="370" y2="380" marker-end="url(#arrow)"/>
    <line x1="590" y1="82" x2="570" y2="82" marker-end="url(#arrow)"/>
    <line x1="690" y1="114" x2="690" y2="160" marker-end="url(#arrow)"/>
    <line x1="690" y1="224" x2="690" y2="270" marker-end="url(#arrow)"/>
    <line x1="690" y1="334" x2="690" y2="380" marker-end="url(#arrow)"/>
    <line x1="790" y1="380" x2="810" y2="334" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <line x1="790" y1="412" x2="810" y2="412" marker-end="url(#arrow)"/>
    <line x1="810" y1="444" x2="790" y2="600" marker-end="url(#arrow)"/>
    <line x1="910" y1="444" x2="910" y2="600" marker-end="url(#arrow)"/>
    <line x1="1010" y1="444" x2="1030" y2="600" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <line x1="790" y1="632" x2="810" y2="632" marker-end="url(#arrow)"/>
    <line x1="1030" y1="632" x2="1010" y2="632" marker-end="url(#arrow)"/>
    <line x1="350" y1="412" x2="370" y2="412" marker-end="url(#arrow)"/>
    <line x1="370" y1="444" x2="350" y2="490" marker-end="url(#arrow)"/>
    <line x1="470" y1="554" x2="470" y2="600" marker-end="url(#arrow)"/>
    <line x1="370" y1="554" x2="350" y2="600" marker-end="url(#arrow)"/>
    <line x1="570" y1="632" x2="590" y2="632" marker-end="url(#arrow)"/>
    <line x1="350" y1="664" x2="370" y2="710" marker-end="url(#arrow)"/>
    <line x1="470" y1="664" x2="470" y2="710" marker-end="url(#arrow)"/>
    <line x1="590" y1="664" x2="570" y2="710" marker-end="url(#arrow)"/>
    <line x1="570" y1="380" x2="810" y2="334" marker-end="url(#arrow)"/>
    <line x1="910" y1="664" x2="910" y2="710" marker-end="url(#arrow)"/>
    <line x1="1130" y1="664" x2="1130" y2="710" marker-end="url(#arrow)"/>
  </g>
  <rect x="370" y="50" width="200" height="64" rx="6" fill="#e8e8e8" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="470" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Spec</text>
  <text x="470" y="90" text-anchor="middle" font-size="11" fill="#111111">UI framework</text>
  <text x="470" y="104" text-anchor="middle" font-size="11" fill="#111111">Morphic backend by default</text>
  <rect x="150" y="50" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="250" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Spec-Morphic</text>
  <text x="250" y="90" text-anchor="middle" font-size="11" fill="#111111">Morphic backend of Spec</text>
  <rect x="590" y="50" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="690" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Spec-Toplo</text>
  <text x="690" y="90" text-anchor="middle" font-size="11" fill="#111111">Toplo backend for Spec</text>
  <rect x="590" y="160" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="690" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Toplo</text>
  <text x="690" y="200" text-anchor="middle" font-size="11" fill="#111111">widget framework on Bloc</text>
  <text x="690" y="214" text-anchor="middle" font-size="11" fill="#111111">needs Album</text>
  <rect x="590" y="270" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="690" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Album</text>
  <text x="690" y="310" text-anchor="middle" font-size="11" fill="#111111">text editor widgets</text>
  <text x="690" y="324" text-anchor="middle" font-size="11" fill="#111111">needs Bloc</text>
  <rect x="810" y="270" width="200" height="64" rx="6" fill="#e8e8e8" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="910" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">OSWindow / PharoSDL3</text>
  <text x="910" y="310" text-anchor="middle" font-size="11" fill="#111111">windows, SDL2 and SDL3</text>
  <rect x="150" y="380" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="250" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Rubric</text>
  <text x="250" y="420" text-anchor="middle" font-size="11" fill="#111111">text editor in Morphic</text>
  <rect x="370" y="380" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="470" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Morphic</text>
  <text x="470" y="420" text-anchor="middle" font-size="11" fill="#111111">UI framework</text>
  <text x="470" y="434" text-anchor="middle" font-size="11" fill="#111111">widgets and event loop</text>
  <rect x="590" y="380" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="690" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Bloc</text>
  <text x="690" y="420" text-anchor="middle" font-size="11" fill="#111111">UI infrastructure</text>
  <text x="690" y="434" text-anchor="middle" font-size="11" fill="#111111">elements, layout, events</text>
  <rect x="810" y="380" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="910" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Bloc-Alexandrie</text>
  <text x="910" y="420" text-anchor="middle" font-size="11" fill="#111111">drawing through Alexandrie</text>
  <rect x="150" y="490" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="250" y="512" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Balloon</text>
  <text x="250" y="530" text-anchor="middle" font-size="11" fill="#111111">canvas used by Morphic</text>
  <text x="250" y="544" text-anchor="middle" font-size="11" fill="#111111">package FormCanvas-Core</text>
  <rect x="370" y="490" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="470" y="512" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Athens</text>
  <text x="470" y="530" text-anchor="middle" font-size="11" fill="#111111">2D vector API</text>
  <text x="470" y="544" text-anchor="middle" font-size="11" fill="#111111">Cairo backend</text>
  <rect x="590" y="600" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="690" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Alexandrie-Cairo</text>
  <text x="690" y="640" text-anchor="middle" font-size="11" fill="#111111">FFI to Cairo</text>
  <rect x="150" y="600" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="250" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Athens-Cairo</text>
  <text x="250" y="640" text-anchor="middle" font-size="11" fill="#111111">FFI to Cairo, in Athens</text>
  <rect x="370" y="600" width="200" height="64" rx="6" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
  <text x="470" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Alexandrie-Athens</text>
  <text x="470" y="640" text-anchor="middle" font-size="11" fill="#111111">Athens canvas on the Cairo</text>
  <text x="470" y="654" text-anchor="middle" font-size="11" fill="#111111">bindings of Alexandrie</text>
  <rect x="810" y="600" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="910" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Alexandrie-FreeType</text>
  <text x="910" y="640" text-anchor="middle" font-size="11" fill="#111111">FFI to FreeType</text>
  <text x="910" y="654" text-anchor="middle" font-size="11" fill="#111111">text drawing and measuring</text>
  <rect x="1030" y="600" width="200" height="64" rx="6" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="1130" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Alexandrie-Harfbuzz</text>
  <text x="1130" y="640" text-anchor="middle" font-size="11" fill="#111111">FFI to HarfBuzz</text>
  <text x="1130" y="654" text-anchor="middle" font-size="11" fill="#111111">to replace FreeType (planned)</text>
  <rect x="370" y="710" width="200" height="64" rx="6" fill="#fde7c4" stroke="#b06d1c" stroke-width="1.5"/>
  <text x="470" y="732" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cairo</text>
  <text x="470" y="750" text-anchor="middle" font-size="11" fill="#111111">C 2D graphics library</text>
  <rect x="810" y="710" width="200" height="64" rx="6" fill="#fde7c4" stroke="#b06d1c" stroke-width="1.5"/>
  <text x="910" y="732" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">FreeType</text>
  <text x="910" y="750" text-anchor="middle" font-size="11" fill="#111111">C font library</text>
  <rect x="1030" y="710" width="200" height="64" rx="6" fill="#fde7c4" stroke="#b06d1c" stroke-width="1.5"/>
  <text x="1130" y="732" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">HarfBuzz</text>
  <text x="1130" y="750" text-anchor="middle" font-size="11" fill="#111111">C text shaping library</text>
  <g font-size="12" fill="#111111">
    <rect x="150" y="800" width="24" height="16" rx="3" fill="#cfe3ff" stroke="#2d6cb5" stroke-width="1.5"/>
    <text x="182" y="813">Morphic stack</text>
    <rect x="300" y="800" width="24" height="16" rx="3" fill="#e8e8e8" stroke="#6b6b6b" stroke-width="1.5"/>
    <text x="332" y="813">Shared</text>
    <rect x="400" y="800" width="24" height="16" rx="3" fill="#d4f1dc" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="432" y="813">Bloc stack</text>
    <rect x="530" y="800" width="24" height="16" rx="3" fill="#fde7c4" stroke="#b06d1c" stroke-width="1.5"/>
    <text x="562" y="813">Native (C) library</text>
    <line x1="700" y1="808" x2="730" y2="808" stroke="#555555" stroke-width="1.5"/>
    <text x="738" y="813">required</text>
    <line x1="820" y1="808" x2="850" y2="808" stroke="#555555" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="858" y="813">optional</text>
    <text x="150" y="840">Layers go from low-level at the bottom to high-level at the top. An arrow points to what the project depends on.</text>
  </g>
</svg>
