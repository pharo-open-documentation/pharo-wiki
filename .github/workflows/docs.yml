name: Documentation

# Builds the site on every pull request so that broken links and anchors fail before merge. The build runs in strict mode, so any MkDocs warning fails the job.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build the site in strict mode
        run: zensical build --strict
